<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlowSense AI — Intelligent Crowd Management System</title>
  <meta name="description" content="AI-powered crowd monitoring, virtual queuing, and safety prediction platform for public spaces in India.">
  
  <!-- PWA & Mobile Web App Capabilities -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlowSense AI">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3658/3658756.png">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            saffron: {
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
            },
            status: {
              low: '#10b981',       // Emerald
              moderate: '#3b82f6',  // Blue
              high: '#f59e0b',      // Amber
              critical: '#ef4444',  // Red
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
            'radar-sweep': 'radarSweep 4s linear infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            radarSweep: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' },
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel standalone for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js for smooth interactive charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- QR Code Generator library -->
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

  <!-- Canvas Confetti for ticket celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Custom scrollbars & glassmorphism effects */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-light {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .glow-blue {
      box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.4);
    }
    .glow-red {
      box-shadow: 0 0 25px -5px rgba(239, 68, 68, 0.5);
    }
    .glow-emerald {
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.4);
    }
    .heat-gradient {
      background: radial-gradient(circle, rgba(239,68,68,0.4) 0%, rgba(245,158,11,0.25) 45%, rgba(16,185,129,0.1) 75%, transparent 100%);
    }
    
    /* Prevent unwanted mobile highlight & callouts */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-brand-500 selection:text-white antialiased overscroll-none">
  <div id="root"></div>

  <!-- Main Application Scripts & Configuration -->
  <script src="config.js"></script>
  <script type="text/babel" src="src/services/geminiService.js"></script>
  <script type="text/babel" src="src/services/hapticsService.js"></script>
  <script type="text/babel" src="src/types/index.js"></script>
  <script type="text/babel" src="src/data/mockData.js"></script>
  <script type="text/babel" src="src/context/CrowdContext.js"></script>
  <script type="text/babel" src="src/components/common/ApiKeyModal.js"></script>
  <script type="text/babel" src="src/components/common/GeminiAssistantModal.js"></script>
  <script type="text/babel" src="src/components/common/Navbar.js"></script>
  <script type="text/babel" src="src/components/common/MobileBottomNav.js"></script>
  <script type="text/babel" src="src/components/common/StatusBadge.js"></script>
  <script type="text/babel" src="src/components/common/CapacityGauge.js"></script>
  <script type="text/babel" src="src/components/landing/LandingView.js"></script>
  <script type="text/babel" src="src/components/citizen/CitizenView.js"></script>
  <script type="text/babel" src="src/components/citizen/LocationDetailModal.js"></script>
  <script type="text/babel" src="src/components/citizen/VirtualQueueModal.js"></script>
  <script type="text/babel" src="src/components/admin/AdminDashboard.js"></script>
  <script type="text/babel" src="src/components/admin/VenueManagerModal.js"></script>
  <script type="text/babel" src="src/components/admin/CameraFeedGrid.js"></script>
  <script type="text/babel" src="src/components/kiosk/KioskScanner.js"></script>
  <script type="text/babel" src="src/App.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('FlowSense PWA ServiceWorker registered:', reg.scope))
          .catch((err) => console.warn('FlowSense PWA ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
