  <!-- Smart Hybrid Auto-Redirect to Production hosted site when online -->
  <script>
    (function () {
      const HOSTED_URL = "https://flowsense.subasish.in/";
      if (window.location.href.startsWith(HOSTED_URL)) return;

      if (navigator.onLine && window.location.protocol !== "file:") {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1200);

        fetch(HOSTED_URL, {mode: 'no-cors', signal: controller.signal})
          .then(function () {
            clearTimeout(timeoutId);
            window.location.replace(HOSTED_URL);
          })
          .catch(function () {
            console.log("FlowSense Hosted URL unreachable. Loading high-performance offline local app...");
          });
      }
    })();
  </script>

    // --- START src/services/geminiService.js ---
    // FlowSense AI - Google Gemini API Integration Service

    (function () {
      const getApiKey = () => {
        return localStorage.getItem('FLOWSENSE_GEMINI_API_KEY') ||
          (window.FLOWSENSE_CONFIG && window.FLOWSENSE_CONFIG.GEMINI_API_KEY) ||
          '';
      };

      const setApiKey = (key) => {
        const trimmed = (key || '').trim();
        localStorage.setItem('FLOWSENSE_GEMINI_API_KEY', trimmed);
        if (window.FLOWSENSE_CONFIG) {
          window.FLOWSENSE_CONFIG.GEMINI_API_KEY = trimmed;
        }
        return trimmed;
      };

      const hasValidKey = () => {
        const key = getApiKey();
        return Boolean(key && key.length > 10);
      };

      // Generic call to Gemini REST API
      const callGeminiAPI = async (prompt, systemInstruction = '') => {
        const key = getApiKey();
        if (!key) {
          throw new Error('Gemini API Key is missing. Please add your key in the API Key settings modal.');
        }

        const model = (window.FLOWSENSE_CONFIG && window.FLOWSENSE_CONFIG.GEMINI_MODEL) || 'gemini-2.0-flash';
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;

        const contents = [];
        if (systemInstruction) {
          contents.push({
            role: 'user',
            parts: [{text: `SYSTEM INSTRUCTION: ${systemInstruction}`}]
          });
          contents.push({
            role: 'model',
            parts: [{text: 'Understood. I will act strictly according to these crowd safety guidelines.'}]
          });
        }

        contents.push({
          role: 'user',
          parts: [{text: prompt}]
        });

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: contents,
            generationConfig: {
              temperature: 0.4,
              maxOutputTokens: 1000
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const msg = errData?.error?.message || `HTTP ${response.status}: ${response.statusText}`;
          throw new Error(`Gemini API Error: ${msg}`);
        }

        const data = await response.json();
        const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!replyText) {
          throw new Error('Received empty response from Gemini API.');
        }

        return replyText;
      };

      // Test API Key connection
      const testApiKey = async (keyToTest) => {
        const model = (window.FLOWSENSE_CONFIG && window.FLOWSENSE_CONFIG.GEMINI_MODEL) || 'gemini-2.0-flash';
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${keyToTest}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            contents: [{role: 'user', parts: [{text: 'Respond with "OK" if connected.'}]}]
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData?.error?.message || 'Invalid API Key or network issue.');
        }

        return true;
      };

      // Analyze specific location crowd & generate safety predictions
      const analyzeCrowdLocation = async (location) => {
        const occupancyPct = Math.round((location.currentCount / location.capacity) * 100);
        const systemPrompt = `You are FlowSense AI — an expert AI Crowd Safety & Queue Optimization Engine for public venues in India. Provide concise, high-impact structured recommendations in clean Markdown format with headers and bullet points.`;

        const userPrompt = `Analyze the current live telemetry for venue:
- Name: ${location.name} (${location.city})
- Category: ${location.category}
- Live Headcount: ${location.currentCount} / Capacity: ${location.capacity} (${occupancyPct}% Occupancy)
- Current Status: ${location.status} (Safety Threshold: ${location.safetyThreshold}%)
- Avg Wait Time: ${location.avgWaitMinutes} mins
- Active Open Counters: ${location.counters.map(c => c.name).join(', ')}

Please provide:
1. 🚨 **Current Safety & Density Risk Level** (Low / Moderate / High / Critical with short rationale)
2. 💡 **Optimal Visitor Recommendation Window** (When citizens should visit today)
3. ⚡ **Immediate Operator Action Items** (2-3 operational steps for gate managers, e.g. throttle entrance, open emergency gate 2, dispatch crowd safety unit)
4. 🔮 **4-Hour Forward Prediction** (Expected trend and risk warning)`;

        return await callGeminiAPI(userPrompt, systemPrompt);
      };

      // Analyze camera feed stream
      const analyzeCameraFeed = async (feed) => {
        const systemPrompt = `You are FlowSense AI Optical Vision Analyst. Analyze CCTV sensor metrics and provide real-time crowd behavior diagnosis.`;
        const userPrompt = `CCTV Stream Analysis:
- Feed Name: ${feed.name}
- Location: ${feed.locationName}
- Detected Person Count: ${feed.detectedCount}
- Density Score: ${feed.densityScore}/100
- Feed Status: ${feed.status}

Provide:
1. 🎯 **Density & Flow Vector Analysis**
2. ⚠️ **Stampede / Bottleneck Risk Flag**
3. 🛡️ **Tactical Intervention Action**`;

        return await callGeminiAPI(userPrompt, systemPrompt);
      };

      // Chat with Gemini AI Assistant
      const chatWithAssistant = async (userMessage, chatHistory = []) => {
        const systemPrompt = `You are FlowSense AI Assistant — a helpful, intelligent crowd control and virtual queuing companion. You assist visitors, commuters, pilgrims, and facility administrators with crowd updates, ticket advice, safety tips, and travel window recommendations. Be warm, accurate, and concise.`;

        const formattedHistory = chatHistory.map(item => `${item.role === 'user' ? 'User' : 'Assistant'}: ${item.text}`).join('\n');
        const fullPrompt = `${formattedHistory ? 'Previous Chat Context:\n' + formattedHistory + '\n\n' : ''}User Question: ${userMessage}`;

        return await callGeminiAPI(fullPrompt, systemPrompt);
      };

      window.GeminiService = {
        getApiKey,
        setApiKey,
        hasValidKey,
        testApiKey,
        analyzeCrowdLocation,
        analyzeCameraFeed,
        chatWithAssistant
      };

    })();

    // --- END src/services/geminiService.js ---

      // Warning pulse pattern for safety alert or crowd surge warning

          try {
            navigator.vibrate([60, 100, 60, 100, 80]);
          } catch (e) { }

      // Error pattern

        if (HapticsService.isSupported()) {
          try {
            navigator.vibrate([100, 50, 100]);
          } catch (e) { }
        }
      }
    };

    // Helper to generate 24h trend history & 24h AI predictions
    window.generateCrowdTrendData = function (locationCapacity, currentCount) {
      const history = [];
      const hours = ['00:00', '02:00', '04:00', '06:00', '08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00'];

      // Historical pattern for past 24 hours
      hours.forEach((h, i) => {
        let multiplier = 0.3;
        if (i >= 3 && i <= 5) multiplier = 0.85; // Morning rush
        else if (i >= 8 && i <= 10) multiplier = 0.95; // Evening rush
        else if (i > 5 && i < 8) multiplier = 0.45; // Afternoon dip

        const count = Math.min(locationCapacity, Math.round(locationCapacity * multiplier * (0.85 + Math.random() * 0.25)));
        history.push({
          time: h,
          headcount: count,
          capacityPct: Math.round((count / locationCapacity) * 100),
          isHistorical: true
        });
      });

      // Future 24-48h AI Forecast
      const forecast = [];
      const futureHours = ['24:00', '+2h', '+4h', '+6h', '+8h', '+10h', '+12h', '+16h', '+20h', '+24h'];
      futureHours.forEach((h, i) => {
        let mult = 0.3;
        if (i >= 2 && i <= 4) mult = 0.90; // Next morning peak
        else if (i >= 7 && i <= 9) mult = 0.80; // Next evening
        const predictedCount = Math.round(locationCapacity * mult * (0.9 + Math.random() * 0.15));
        forecast.push({
          time: h,
          predictedCount: predictedCount,
          riskLevel: predictedCount / locationCapacity > 0.85 ? 'High' : (predictedCount / locationCapacity > 0.6 ? 'Moderate' : 'Low'),
          capacityPct: Math.round((predictedCount / locationCapacity) * 100),
          isHistorical: false
        });
      });

      return {history, forecast};
    };

    // --- START src/context/CrowdContext.js ---
    // FlowSense AI - Global State & Real-Time Simulation Engine

    const CrowdContext = React.createContext();

    function CrowdProvider({children}) {
      const [locations, setLocations] = React.useState(window.INITIAL_LOCATIONS);
      const [alerts, setAlerts] = React.useState(window.INITIAL_ALERTS);
      const [queues, setQueues] = React.useState(window.INITIAL_QUEUES);
      const [cameraFeeds, setCameraFeeds] = React.useState(window.CAMERA_FEEDS);

      const [currentView, setCurrentView] = React.useState('landing'); // landing | citizen | admin | kiosk | login
      const [selectedLocationId, setSelectedLocationId] = React.useState(null);
      const [activeTicket, setActiveTicket] = React.useState(window.INITIAL_QUEUES[0] || null);

      // Auth & User Session State
      const [currentUser, setCurrentUser] = React.useState(() => {
        try {
          const saved = localStorage.getItem('FLOWSENSE_CURRENT_USER');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      // Navigation History Stack & Back Button Navigation
      const [historyStack, setHistoryStack] = React.useState(['landing']);

      const navigateTo = (nextView) => {
        if (nextView === currentView) return;
        setHistoryStack(prev => [...prev, nextView]);
        setCurrentView(nextView);
        if (window.history && window.history.pushState) {
          try {
            window.history.pushState({ view: nextView }, '', '#' + nextView);
          } catch (e) {}
        }
      };

      const goBack = () => {
        setHistoryStack(prev => {
          if (prev.length > 1) {
            const updated = [...prev];
            updated.pop();
            const lastView = updated[updated.length - 1];
            setCurrentView(lastView);
            return updated;
          } else {
            setCurrentView('landing');
            return ['landing'];
          }
        });
      };

      React.useEffect(() => {
        const handlePopState = (e) => {
          if (e.state && e.state.view) {
            setCurrentView(e.state.view);
          } else if (window.location.hash) {
            const hash = window.location.hash.replace('#', '');
            if (['landing', 'citizen', 'admin', 'kiosk', 'login'].includes(hash)) {
              setCurrentView(hash);
            }
          } else {
            setCurrentView('landing');
          }
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const loginUser = (userData) => {
        const userObj = {
          id: 'usr-' + Date.now(),
          name: userData.name || 'User',
          email: userData.email || 'user@flowsense.ai',
          role: userData.role || 'citizen',
          title: userData.title || (userData.role === 'admin' ? 'Admin Director' : userData.role === 'kiosk' ? 'Gate Security Guard' : 'Citizen / Pilgrim'),
          avatar: (userData.name || 'U').charAt(0).toUpperCase(),
          loggedInAt: new Date().toISOString()
        };
        setCurrentUser(userObj);
        if (userData.remember !== false) {
          try {
            localStorage.setItem('FLOWSENSE_CURRENT_USER', JSON.stringify(userObj));
          } catch (e) {}
        }
        return userObj;
      };

      const logoutUser = () => {
        setCurrentUser(null);
        try {
          localStorage.removeItem('FLOWSENSE_CURRENT_USER');
        } catch (e) {}
        setCurrentView('landing');
      };

      const [simulationRunning, setSimulationRunning] = React.useState(true);
      const [soundEnabled, setSoundEnabled] = React.useState(true);
      const [searchQuery, setSearchQuery] = React.useState('');
      const [selectedCategory, setSelectedCategory] = React.useState('All');
      const [selectedCity, setSelectedCity] = React.useState('All');
      const [selectedStatusFilter, setSelectedStatusFilter] = React.useState('All');

      // Audio Synth for Queue Alert Notification
      const playAlertChime = React.useCallback(() => {
        if (!soundEnabled) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3); // A5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {
          console.log('Audio playback prevented or unsupported');
        }
      }, [soundEnabled]);

      // Real-time dynamic simulation ticker
      React.useEffect(() => {
        if (!simulationRunning) return;

        const interval = setInterval(() => {
          // 1. Fluctuate location counts realistically
          setLocations(prevLocations => {
            return prevLocations.map(loc => {
              const delta = Math.floor(Math.random() * 41) - 18; // -18 to +22
              const newCount = Math.max(50, Math.min(loc.capacity, loc.currentCount + delta));
              const pct = (newCount / loc.capacity) * 100;

              let newStatus = 'Low';
              if (pct >= 85) newStatus = 'Critical';
              else if (pct >= 70) newStatus = 'High';
              else if (pct >= 45) newStatus = 'Moderate';

              return {
                ...loc,
                currentCount: newCount,
                status: newStatus
              };
            });
          });

          // 2. Advance active virtual queue positions
          setQueues(prevQueues => {
            return prevQueues.map(q => {
              if (q.status === 'Waiting' && q.position > 1) {
                // 30% chance per tick to step forward in queue
                if (Math.random() < 0.35) {
                  const nextPos = q.position - 1;
                  const nextWait = Math.max(1, Math.round(nextPos * 2.5));

                  if (nextPos <= 2) {
                    playAlertChime();
                  }

                  const updated = {
                    ...q,
                    position: nextPos,
                    estimatedWaitMinutes: nextWait
                  };

                  if (activeTicket && activeTicket.id === q.id) {
                    setActiveTicket(updated);
                  }
                  return updated;
                }
              }
              return q;
            });
          });

          // 3. Fluctuate CCTV camera sensor counts
          setCameraFeeds(prevFeeds => {
            return prevFeeds.map(feed => {
              if (feed.status !== 'Active') return feed;
              const shift = Math.floor(Math.random() * 11) - 5;
              return {
                ...feed,
                detectedCount: Math.max(10, feed.detectedCount + shift)
              };
            });
          });

        }, 3500);

        return () => clearInterval(interval);
      }, [simulationRunning, playAlertChime, activeTicket]);

      // Actions
      const joinQueue = (location, counter, userData) => {
        const randomNum = Math.floor(Math.random() * 900) + 100;
        const tokenCode = `${location.shortName.substring(0, 4).toUpperCase()}-${counter.name.charAt(8) || 'A'}-${randomNum}`;
        const initialPos = Math.floor(Math.random() * 8) + 3; // 3 to 10
        const estWait = Math.round(initialPos * 3);

        const newTicket = {
          id: 'tkn-' + Date.now(),
          locationId: location.id,
          locationName: location.name,
          counterName: counter.name,
          userName: userData.name,
          userPhone: userData.phone,
          partySize: userData.partySize || 1,
          position: initialPos,
          tokenNo: tokenCode,
          estimatedWaitMinutes: estWait,
          status: 'Waiting',
          joinedAt: new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}),
          hasAssistance: userData.hasAssistance || false,
          qrCodeData: `FLOWSENSE:${tokenCode}:${userData.name}:${location.shortName}`
        };

        setQueues(prev => [newTicket, ...prev]);
        setActiveTicket(newTicket);
        playAlertChime();

        // Trigger celebration confetti
        if (window.confetti) {
          window.confetti({particleCount: 70, spread: 60, origin: {y: 0.7}});
        }

        return newTicket;
      };

      const leaveQueue = (ticketId) => {
        setQueues(prev => prev.filter(q => q.id !== ticketId));
        if (activeTicket && activeTicket.id === ticketId) {
          setActiveTicket(null);
        }
      };

      const addLocation = (newLocData) => {
        const newLoc = {
          id: 'loc-' + Date.now(),
          name: newLocData.name,
          shortName: newLocData.shortName || newLocData.name.substring(0, 15),
          city: newLocData.city,
          state: newLocData.state || 'India',
          category: newLocData.category,
          address: newLocData.address || `${newLocData.city}, India`,
          capacity: parseInt(newLocData.capacity, 10) || 5000,
          currentCount: parseInt(newLocData.currentCount, 10) || 500,
          status: 'Low',
          safetyThreshold: parseInt(newLocData.safetyThreshold, 10) || 85,
          avgWaitMinutes: 10,
          openGates: ['Main Gate 1', 'North Exit Gate 2'],
          activeCameras: 4,
          totalCameras: 4,
          coordinates: {lat: 19.0760, lng: 72.8777},
          image: newLocData.image || 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=800&q=80',
          description: newLocData.description || 'Public facility monitored by FlowSense AI.',
          bestTimeWindow: '13:00 - 15:00 today',
          activeAlertsCount: 0,
          counters: [
            {id: 'c1', name: 'General Counter A', waitMinutes: 10, queueLength: 15},
            {id: 'c2', name: 'Priority Express B', waitMinutes: 5, queueLength: 5}
          ]
        };

        setLocations(prev => [newLoc, ...prev]);
      };

      const addAlert = (alertMsg, severity, locationId = 'loc-1') => {
        const targetLoc = locations.find(l => l.id === locationId) || locations[0];
        const newAlert = {
          id: 'alt-' + Date.now(),
          locationId: targetLoc.id,
          locationName: targetLoc.shortName,
          message: alertMsg,
          severity: severity, // critical | high | moderate
          timeAgo: 'Just now',
          timestamp: new Date().toISOString(),
          isResolved: false
        };

        setAlerts(prev => [newAlert, ...prev]);
        playAlertChime();
      };

      const resolveAlert = (alertId) => {
        setAlerts(prev => prev.map(a => a.id === alertId ? {...a, isResolved: true} : a));
      };

      const toggleCameraFeed = (feedId) => {
        setCameraFeeds(prev => prev.map(f => f.id === feedId ? {...f, status: f.status === 'Active' ? 'Inactive' : 'Active'} : f));
      };

      const value = {
        locations,
        alerts,
        queues,
        cameraFeeds,
        currentView,
        setCurrentView,
        currentUser,
        loginUser,
        logoutUser,
        historyStack,
        navigateTo,
        goBack,
        selectedLocationId,
        setSelectedLocationId,
        activeTicket,
        setActiveTicket,
        simulationRunning,
        setSimulationRunning,
        soundEnabled,
        setSoundEnabled,
        searchQuery,
        setSearchQuery,
        selectedCategory,
        setSelectedCategory,
        selectedCity,
        setSelectedCity,
        selectedStatusFilter,
        setSelectedStatusFilter,
        joinQueue,
        leaveQueue,
        addLocation,
        addAlert,
        resolveAlert,
        toggleCameraFeed,
        playAlertChime
      };

      return (
        <CrowdContext.Provider value={value}>
          {children}
        </CrowdContext.Provider>
      );
    }

    window.CrowdContext = CrowdContext;
    window.CrowdProvider = CrowdProvider;

    function GeminiAssistantModal({isOpen, onClose}) {
      const [messages, setMessages] = React.useState([
        {
          role: 'assistant',
          text: 'Namaste! I am **FlowSense AI Assistant** powered by Google Gemini. Ask me about live crowd conditions in Tirupati, Dadar, Rajiv Chowk, virtual queue booking, optimal visit windows, or venue safety rules!'
        }
      ]);
      const [inputText, setInputText] = React.useState('');
      const [isLoading, setIsLoading] = React.useState(false);
      const messagesEndRef = React.useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({behavior: 'smooth'});
      };

      React.useEffect(() => {
        scrollToBottom();
      }, [messages, isLoading]);

      if (!isOpen) return null;

      const handleSend = async (e) => {
        e.preventDefault();
        const query = inputText.trim();
        if (!query || isLoading) return;

        const userMsg = {role: 'user', text: query};
        setMessages(prev => [...prev, userMsg]);
        setInputText('');
        setIsLoading(true);

        try {
          if (window.GeminiService && window.GeminiService.hasValidKey()) {
            const reply = await window.GeminiService.chatWithAssistant(query, messages);
            setMessages(prev => [...prev, {role: 'assistant', text: reply}]);
          } else {
            // Fallback intelligent simulation reply if no key added yet
            setTimeout(() => {
              setMessages(prev => [...prev, {
                role: 'assistant',
                text: `(Demo Mode) I processed your query regarding "${query}". For live real-time AI responses, please connect your **Google Gemini API Key** via the key icon in the navigation header!`
              }]);
              setIsLoading(false);
            }, 1000);
            return;
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            role: 'assistant',
            text: `⚠️ Error calling Gemini API: ${err.message}. Please check your API key.`
          }]);
        } finally {
          setIsLoading(false);
        }
      };

      const quickPrompts = [
        "What is the best time to visit Tirupati Balaji today?",
        "How does the virtual queue pass work?",
        "What should venue safety officers do during High Density alerts?",
        "Check crowd level at Dadar Central Station"
      ];

      const [isListening, setIsListening] = React.useState(false);

      const handleVoiceInput = () => {
        if (window.HapticsService) window.HapticsService.lightTap();

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Voice dictation is supported on modern mobile browsers (Chrome, Safari, Edge). Please type your message.');
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'en-IN';
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;

          recognition.onstart = () => setIsListening(true);
          recognition.onend = () => setIsListening(false);
          recognition.onerror = () => setIsListening(false);
          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (transcript) {
              setInputText(prev => (prev ? prev + ' ' + transcript : transcript));
            }
          };
          recognition.start();
        } catch (e) {
          setIsListening(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-2xl bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[85vh] sm:h-[620px]">

            {/* Header */}
            <div className="p-4 sm:p-5 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white shadow-lg glow-blue">
                  <i data-lucide="sparkles" className="w-5 h-5"></i>
                </div>
                <div>
                  <h3 className="font-heading font-extrabold text-base text-white flex items-center gap-2">
                    <span>FlowSense Gemini AI Assistant</span>
                    <span className="bg-brand-950 text-brand-300 border border-brand-500/30 text-[10px] px-2 py-0.5 rounded font-mono">LIVE AI</span>
                  </h3>
                  <p className="text-xs text-slate-400">Ask safety protocols, queue updates, or visit time recommendations</p>
                </div>
              </div>

              <button
                onClick={onClose}
                className="p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white transition"
              >
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            {/* Message History */}
            <div className="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
              {messages.map((msg, idx) => (
                <div
                  key={idx}
                  className={`flex items-start gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}
                >
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${msg.role === 'user' ? 'bg-brand-600 text-white' : 'bg-slate-800 text-saffron-400 border border-slate-700'
                    }`}>
                    {msg.role === 'user' ? 'YOU' : 'AI'}
                  </div>

                  <div className={`max-w-[80%] rounded-2xl p-4 text-xs leading-relaxed ${msg.role === 'user'
                      ? 'bg-brand-600 text-white rounded-tr-none'
                      : 'bg-slate-950 border border-slate-800 text-slate-200 rounded-tl-none space-y-2'
                    }`}>
                    {msg.text}
                  </div>
                </div>
              ))}

              {isLoading && (
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-slate-800 text-saffron-400 border border-slate-700 flex items-center justify-center text-xs font-bold">
                    AI
                  </div>
                  <div className="bg-slate-950 border border-slate-800 px-4 py-3 rounded-2xl text-xs text-slate-400 flex items-center gap-2">
                    <i data-lucide="loader-2" className="w-4 h-4 animate-spin text-brand-400"></i>
                    <span>Gemini AI is analyzing crowd model...</span>
                  </div>
                </div>
              )}

              <div ref={messagesEndRef} />
            </div>

            {/* Quick Suggestion Chips */}
            {messages.length <= 2 && (
              <div className="px-4 py-2 bg-slate-950/60 border-t border-slate-800/80 flex items-center gap-2 overflow-x-auto">
                <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider shrink-0">Try asking:</span>
                {quickPrompts.map((p, i) => (
                  <button
                    key={i}
                    onClick={() => {setInputText(p);}}
                    className="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-slate-700"
                  >
                    {p}
                  </button>
                ))}
              </div>
            )}

            {/* Input Bar with Mobile Voice Dictation */}
            <form onSubmit={handleSend} className="p-3 sm:p-4 bg-slate-950 border-t border-slate-800 flex items-center gap-2">
              <button
                type="button"
                onClick={handleVoiceInput}
                className={`p-2.5 rounded-xl border text-xs transition ${isListening
                    ? 'bg-rose-600 border-rose-400 text-white animate-pulse'
                    : 'bg-slate-900 border-slate-700/80 text-slate-400 hover:text-white'
                  }`}
                title="Voice query dictation (Web Speech API)"
              >
                <i data-lucide={isListening ? 'mic-off' : 'mic'} className="w-4 h-4"></i>
              </button>

              <input
                type="text"
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                placeholder={isListening ? "Listening... Speak your prompt..." : "Ask Gemini AI about crowd safety or queue updates..."}
                className="flex-1 bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-brand-500"
              />

              <button
                type="submit"
                disabled={isLoading || !inputText.trim()}
                className="px-4 py-2.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 disabled:opacity-50"
              >
                <i data-lucide="send" className="w-4 h-4"></i>
                <span className="hidden sm:inline">Ask AI</span>
              </button>
            </form>

          </div>
        </div>
      );
    }

    window.GeminiAssistantModal = GeminiAssistantModal;

    // FlowSense AI - Top Navigation Bar

    function Navbar() {
      const {
        currentView,
        setCurrentView,
        navigateTo,
        goBack,
        historyStack,
        currentUser,
        logoutUser,
        simulationRunning,
        setSimulationRunning,
        soundEnabled,
        setSoundEnabled,
        activeTicket,
        alerts
      } = React.useContext(window.CrowdContext);

      const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
      const [userDropdownOpen, setUserDropdownOpen] = React.useState(false);
      const [deferredPrompt, setDeferredPrompt] = React.useState(null);

      React.useEffect(() => {
        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
      }, []);

      const handleInstallPWA = async () => {
        if (window.HapticsService) window.HapticsService.mediumTap();
        if (!deferredPrompt) {
          alert('To install FlowSense AI on your mobile device: tap your browser menu (⋮ or Share icon) and select "Add to Home Screen" or "Install App".');
          return;
        }
        deferredPrompt.prompt();
        const {outcome} = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setDeferredPrompt(null);
        }
      };

      const criticalAlertsCount = alerts.filter(a => !a.isResolved && a.severity === 'critical').length;
      const canGoBack = currentView !== 'landing' || (historyStack && historyStack.length > 1);

      const handleNavClick = (viewName) => {
        if (navigateTo) navigateTo(viewName);
        else setCurrentView(viewName);
      };

      return (
        <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 shadow-lg">
          {/* Top Announcement Bar if critical alert exists */}
          {criticalAlertsCount > 0 && (
            <div className="bg-rose-600/90 text-white text-xs px-4 py-1.5 flex items-center justify-between font-medium animate-pulse">
              <div className="flex items-center gap-2 max-w-7xl mx-auto w-full">
                <span className="bg-rose-900/60 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">Critical Safety Alert</span>
                <span className="truncate">{alerts.find(a => !a.isResolved && a.severity === 'critical')?.message}</span>
              </div>
            </div>
          )}

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16">

              {/* Brand Logo & Smart Back Navigation Button */}
              <div className="flex items-center gap-3">
                {canGoBack && (
                  <button
                    onClick={goBack}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700/80 text-brand-300 hover:text-white text-xs font-semibold shadow-sm transition-all group"

                    <i data-lucide="arrow-left" className="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
                    <span className="hidden sm:inline">Back</span>
                  </button>

                <div className="flex items-center gap-3 cursor-pointer" onClick={() => handleNavClick('landing')}>

                    <i data-lucide="radar" className="w-5 h-5 animate-spin-slow"></i>
                    <span className="absolute -top-1 -right-1 flex h-3 w-3">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-saffron-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-saffron-500"></span>
                    </span>
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="font-heading font-extrabold text-xl tracking-tight text-white">FlowSense</span>
                      <span className="font-heading font-extrabold text-xl text-brand-400">AI</span>
                      <span className="hidden sm:inline-block bg-slate-800 text-slate-300 text-[10px] px-1.5 py-0.5 rounded font-mono border border-slate-700">IN v2.4</span>
                    </div>
                    <p className="text-[10px] text-slate-400 font-medium tracking-wide">Smart Crowd Safety & Queue Systems</p>
                  </div>
                </div>
              </div>

              {/* Navigation Links (Desktop) */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-950/60 p-1 rounded-xl border border-slate-800/80">

                  onClick={() => handleNavClick('landing')}
                  className={`flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium transition-all ${currentView === 'landing'
                      ? 'bg-brand-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                >
                  <i data-lucide="home" className="w-4 h-4"></i>
                  <span>Home Gateway</span>
                </button>

                <button

                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                >
                  <i data-lucide="users" className="w-4 h-4"></i>
                  <span>Citizen App & Queue</span>
                </button>

                <button

                      ? 'bg-brand-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                >
                  <i data-lucide="shield-alert" className="w-4 h-4"></i>
                  <span>Admin Command</span>
                  {criticalAlertsCount > 0 && (
                    <span className="bg-rose-500 text-white px-1.5 py-0.5 rounded-full text-[10px] font-bold">
                      {criticalAlertsCount}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => handleNavClick('kiosk')}

                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'

                >
                  <i data-lucide="qr-code" className="w-4 h-4"></i>
                  <span>Gate Scanner</span>
                </button>

                <button
                  onClick={() => handleNavClick('login')}
                  className={`flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium transition-all ${currentView === 'login'
                      ? 'bg-brand-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                >
                  <i data-lucide="lock" className="w-4 h-4"></i>
                  <span>Login Portal</span>
                </button>
              </nav>

              {/* Right Action Controls */}
              <div className="flex items-center gap-2 sm:gap-3">

                {/* User Profile / Login Pill */}
                {currentUser ? (
                  <div className="relative">
                    <button
                      onClick={() => setUserDropdownOpen(!userDropdownOpen)}
                      className="flex items-center gap-2 px-2.5 py-1.5 rounded-xl bg-slate-800/90 border border-brand-500/50 text-white text-xs font-semibold shadow-sm hover:border-brand-400 transition"

                      <div className="w-6 h-6 rounded-lg bg-gradient-to-tr from-brand-600 to-indigo-600 text-white text-xs font-bold flex items-center justify-center">

                    </button>

                        <button

                      ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-300'

                  onClick={() => setSoundEnabled(!soundEnabled)}

                  <i data-lucide={soundEnabled ? 'volume-2' : 'volume-x'} className="w-4 h-4"></i>

                {/* Mobile menu hamburger */}
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="md:hidden p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white"
                >
                  <i data-lucide={mobileMenuOpen ? 'x' : 'menu'} className="w-5 h-5"></i>
                </button>
              </div>

            </div>
          </div>

          {/* Mobile Drawer Menu */}
          {mobileMenuOpen && (
            <div className="md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-2">
              {canGoBack && (
                <button
                  onClick={() => {goBack(); setMobileMenuOpen(false);}}
                  className="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-brand-300 bg-slate-800/80 border border-brand-500/30"
                >
                  <i data-lucide="arrow-left" className="w-4 h-4"></i>
                  <span>Go Back</span>
                </button>
              )}

              <button
                onClick={() => {handleNavClick('landing'); setMobileMenuOpen(false);}}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${currentView === 'landing' ? 'bg-brand-600 text-white' : 'text-slate-300 bg-slate-800/50'
                  }`}
              >
                <i data-lucide="home" className="w-4 h-4"></i>
                <span>Home Gateway</span>
              </button>

              <button
                onClick={() => {handleNavClick('citizen'); setMobileMenuOpen(false);}}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${currentView === 'citizen' ? 'bg-brand-600 text-white' : 'text-slate-300 bg-slate-800/50'
                  }`}
              >
                <i data-lucide="users" className="w-4 h-4"></i>
                <span>Citizen App & Queue</span>
              </button>

              <button
                onClick={() => {handleNavClick('admin'); setMobileMenuOpen(false);}}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${currentView === 'admin' ? 'bg-brand-600 text-white' : 'text-slate-300 bg-slate-800/50'
                  }`}
              >
                <i data-lucide="shield-alert" className="w-4 h-4"></i>
                <span>Admin Command Center</span>
              </button>

              <button
                onClick={() => {handleNavClick('kiosk'); setMobileMenuOpen(false);}}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${currentView === 'kiosk' ? 'bg-brand-600 text-white' : 'text-slate-300 bg-slate-800/50'
                  }`}
              >
                <i data-lucide="qr-code" className="w-4 h-4"></i>
                <span>Gate Scanner</span>
              </button>

              <button
                onClick={() => {handleNavClick('login'); setMobileMenuOpen(false);}}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${currentView === 'login' ? 'bg-brand-600 text-white' : 'text-slate-300 bg-slate-800/50'
                  }`}
              >
                <i data-lucide="lock" className="w-4 h-4"></i>
                <span>Login Section</span>
              </button>
            </div>
          )}
        </header>
      );
    }

    window.Navbar = Navbar;

    // FlowSense AI - Status Badge Component

    function StatusBadge({status, showPulse = true, size = 'md'}) {
      let badgeStyle = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
      let dotStyle = 'bg-emerald-400';
      let label = 'Low Crowd';
      let pulseGlow = '';

      if (status === 'Moderate') {
        badgeStyle = 'bg-blue-500/10 text-blue-400 border-blue-500/30';
        dotStyle = 'bg-blue-400';
        label = 'Moderate';
      } else if (status === 'High') {
        badgeStyle = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
        dotStyle = 'bg-amber-400';
        label = 'High Crowd';
      } else if (status === 'Critical') {
        badgeStyle = 'bg-rose-500/10 text-rose-400 border-rose-500/40 glow-red';
        dotStyle = 'bg-rose-500';
        label = 'Critical Density';
        if (showPulse) pulseGlow = 'animate-pulse';
      }

      const paddingStyle = size === 'sm' ? 'px-2 py-0.5 text-xs' : size === 'lg' ? 'px-3.5 py-1.5 text-sm font-semibold' : 'px-2.5 py-1 text-xs font-medium';

      return (
        <span className={`inline-flex items-center gap-1.5 border rounded-full ${paddingStyle} ${badgeStyle} ${pulseGlow}`}>
          <span className="relative flex h-2 w-2">
            {showPulse && (status === 'Critical' || status === 'High') && (
              <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${dotStyle}`}></span>
            )}
            <span className={`relative inline-flex rounded-full h-2 w-2 ${dotStyle}`}></span>
          </span>
          <span>{label}</span>
        </span>
      );
    }

    window.StatusBadge = StatusBadge;

    // --- START src/components/common/CapacityGauge.js ---
    // FlowSense AI - Capacity Gauge Component

    function CapacityGauge({current, capacity, safetyThreshold = 85, showLabel = true}) {
      const percentage = Math.min(100, Math.round((current / capacity) * 100));

      let barColor = 'bg-emerald-500';
      let textColor = 'text-emerald-400';

      if (percentage >= 85) {
        barColor = 'bg-rose-500';
        textColor = 'text-rose-400';
      } else if (percentage >= 70) {
        barColor = 'bg-amber-500';
        textColor = 'text-amber-400';
      } else if (percentage >= 45) {
        barColor = 'bg-blue-500';
        textColor = 'text-blue-400';
      }

      return (
        <div className="w-full">
          {showLabel && (
            <div className="flex items-center justify-between text-xs mb-1.5 font-medium">
              <span className="text-slate-400 flex items-center gap-1">
                <span>Occupancy</span>
                <span className="text-slate-500">({current.toLocaleString()} / {capacity.toLocaleString()})</span>
              </span>
              <span className={`${textColor} font-semibold font-heading text-sm`}>
                {percentage}%
              </span>
            </div>
          )}

          {/* Progress Track */}
          <div className="relative w-full h-2.5 bg-slate-800/80 rounded-full overflow-hidden border border-slate-700/50">
            {/* Safety Limit Indicator line */}
            <div
              className="absolute top-0 bottom-0 w-0.5 bg-rose-500/60 z-10"
              style={{left: `${safetyThreshold}%`}}
              title={`Safety Threshold (${safetyThreshold}%)`}
            />

            {/* Animated Filled Bar */}
            <div
              className={`h-full rounded-full transition-all duration-700 ease-out ${barColor}`}
              style={{width: `${percentage}%`}}
            />
          </div>

          {showLabel && percentage >= safetyThreshold && (
            <div className="flex items-center gap-1 mt-1 text-[11px] text-rose-400 font-medium animate-pulse">
              <span>⚠️ Exceeding Safety Threshold ({safetyThreshold}%)</span>
            </div>
          )}
        </div>
      );
    }

    window.CapacityGauge = CapacityGauge;

    // FlowSense AI - Virtual Queue Join & Digital Token Ticket Modal

    function VirtualQueueModal({location, onClose}) {
      const {joinQueue, activeTicket, leaveQueue} = React.useContext(window.CrowdContext);

      const [selectedCounterId, setSelectedCounterId] = React.useState(location.counters[0]?.id || 'c1');
      const [userName, setUserName] = React.useState('');
      const [userPhone, setUserPhone] = React.useState('');
      const [partySize, setPartySize] = React.useState(1);
      const [hasAssistance, setHasAssistance] = React.useState(false);
      const [createdTicket, setCreatedTicket] = React.useState(null);

      const qrCanvasRef = React.useRef(null);

      // If user already has an active ticket for this location or overall
      const displayTicket = createdTicket || (activeTicket && activeTicket.locationId === location.id ? activeTicket : null);

      // Render QR code canvas using QRious
      React.useEffect(() => {
        if (displayTicket && qrCanvasRef.current && window.QRious) {
          new window.QRious({

    // FlowSense AI - CCTV Vision Sensor Feeds Control Room

    function CameraFeedGrid() {
      const {cameraFeeds, toggleCameraFeed, addAlert} = React.useContext(window.CrowdContext);

      const [aiMode, setAiMode] = React.useState('Density Heatmap');
      const [activeScans, setActiveScans] = React.useState({}); // feedId -> { loading, result }

      const handleGeminiScan = async (feed) => {
        setActiveScans(prev => ({...prev, [feed.id]: {loading: true, result: ''}}));
        try {
          if (window.GeminiService && window.GeminiService.hasValidKey()) {
            const res = await window.GeminiService.analyzeCameraFeed(feed);
            setActiveScans(prev => ({...prev, [feed.id]: {loading: false, result: res}}));
          } else {
            setTimeout(() => {
              setActiveScans(prev => ({
                ...prev,
                [feed.id]: {
                  loading: false,
                  result: `### 🎯 Gemini Vision Stream Report (${feed.name})
- **Density Vector**: High crowd flow towards Gate 1 (Count: ${feed.detectedCount})
- **Risk Assessment**: Moderate Bottleneck Risk. Velocity ~0.6m/s.
- **Recommended Officer Action**: Dispatch 2 security marshals to divert crowd flow to West Auxiliary Gate.`
                }
              }));
            }, 800);
          }

          setActiveScans(prev => ({...prev, [feed.id]: {loading: false, result: `⚠️ Error: ${err.message}`}}));
        }

                  <div className="flex items-center gap-2">

                      <span>{activeScans[feed.id]?.loading ? 'Scanning...' : 'Gemini Vision Scan'}</span>

    // FlowSense AI - Gate Scanner & Check-in Kiosk

    function KioskScanner() {
      const {locations, queues, setQueues, setLocations} = React.useContext(window.CrowdContext);

      const [selectedLocId, setSelectedLocId] = React.useState(locations[0]?.id || 'loc-1');
      const [manualToken, setManualToken] = React.useState('');
      const [torchActive, setTorchActive] = React.useState(false);
      const [cameraFacing, setCameraFacing] = React.useState('environment'); // 'environment' | 'user'
      const [lastCheckIn, setLastCheckIn] = React.useState(null);
      const [checkInHistory, setCheckInHistory] = React.useState([
        {tokenNo: 'TIRU-B-072', name: 'Rohan Deshmukh', gate: 'Gate 2 SSD', time: '20:14 PM'},
        {tokenNo: 'DADAR-A-102', name: 'Priya Iyer', gate: 'Footover Bridge 1', time: '20:10 PM'}
      ]);

      const targetLoc = locations.find(l => l.id === selectedLocId) || locations[0];

      const handleScanCheckIn = (tokenInput) => {
        const tokenToProcess = tokenInput || manualToken;
        if (!tokenToProcess.trim()) return;

        if (window.HapticsService) {
          window.HapticsService.success();
        }

        // Find in queues or create dummy valid scan
        const matchedQueue = queues.find(q => q.tokenNo.toLowerCase() === tokenToProcess.toLowerCase());

        const entryRecord = {
          tokenNo: tokenToProcess.toUpperCase(),
          name: matchedQueue ? matchedQueue.userName : 'Citizen Guest',
          gate: targetLoc.openGates[0] || 'Main Entry Gate',
          time: new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'})
        };

        setLastCheckIn(entryRecord);
        setCheckInHistory(prev => [entryRecord, ...prev]);

        // Auto update capacity (decrement queue position / update headcount)
        setLocations(prev => prev.map(loc => {
          if (loc.id === targetLoc.id) {
            return {
              ...loc,
              currentCount: Math.min(loc.capacity, loc.currentCount + (matchedQueue ? matchedQueue.partySize : 1))
            };
          }
          return loc;
        }));

        if (matchedQueue) {
          setQueues(prev => prev.filter(q => q.id !== matchedQueue.id));
        }

        setManualToken('');

        if (window.confetti) {
          window.confetti({particleCount: 40, spread: 50, origin: {y: 0.8}});
        }
      };

      return (
        <div className="space-y-6 pb-20 max-w-4xl mx-auto">

          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl sm:text-3xl font-extrabold font-heading text-white flex items-center gap-2.5">
                <i data-lucide="qr-code" className="w-7 h-7 sm:w-8 sm:h-8 text-brand-400"></i>
                <span>Gate Entrance QR Check-In Scanner</span>
              </h1>
              <p className="text-xs sm:text-sm text-slate-400 mt-1">
                Mobile scanner kiosk for security guards at public facility gates.
              </p>
            </div>

            <div className="w-full sm:w-64">
              <label className="text-[11px] text-slate-400 font-medium block mb-1">Current Gate Location:</label>
              <select
                value={selectedLocId}
                onChange={(e) => setSelectedLocId(e.target.value)}
                className="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-xs text-white"
              >
                {locations.map(l => (
                  <option key={l.id} value={l.id}>{l.name}</option>
                ))}
              </select>
            </div>
          </div>

          {/* SCANNER INTERFACE CARD */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

            {/* Visual Camera Scanner Frame */}
            <div className="glass-card p-5 sm:p-6 rounded-3xl border border-slate-800 flex flex-col items-center justify-center space-y-4 text-center">

              {/* Mobile Camera Controls Bar */}
              <div className="flex items-center justify-between w-full px-2 text-xs">
                <span className="text-[11px] text-slate-400 flex items-center gap-1.5 font-mono">
                  <span className="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span>
                  <span>Camera ({cameraFacing === 'environment' ? 'Rear' : 'Front'})</span>
                </span>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setTorchActive(!torchActive)}
                    className={`p-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition ${torchActive ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300'

      const [selectedRole, setSelectedRole] = React.useState('citizen'); // 'citizen' | 'admin' | 'kiosk'

      const [email, setEmail] = React.useState('');

      const [fullName, setFullName] = React.useState('');
      const [showPassword, setShowPassword] = React.useState(false);
      const [rememberMe, setRememberMe] = React.useState(true);
      const [errorMsg, setErrorMsg] = React.useState('');
      const [successMsg, setSuccessMsg] = React.useState('');
      const [isLoading, setIsLoading] = React.useState(false);

      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [authMode, selectedRole, errorMsg, successMsg]);

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        if (!email || !password || (authMode === 'register' && !fullName)) {
          setErrorMsg('Please complete all required fields.');
          return;
        }

          setErrorMsg('Password must be at least 4 characters.');
          return;
        }

        setIsLoading(true);

        setTimeout(() => {
          setIsLoading(false);
          const userName = authMode === 'register' 
            ? fullName 
            : email.split('@')[0].replace('.', ' ').replace(/^./, str => str.toUpperCase()) || 'User';

          const user = loginUser({
            email: email,
            name: userName,
            role: selectedRole,
            remember: rememberMe
          });

          setSuccessMsg(`Welcome back, ${user.name}! Redirecting to ${selectedRole.toUpperCase()} section...`);

          setTimeout(() => {
            if (selectedRole === 'admin') setCurrentView('admin');

      // Initialize Lucide icons on view changes & set up custom event listeners
      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }

        const handleOpenKeyModal = () => setIsApiKeyModalOpen(true);
        const handleOpenAssistantModal = () => setIsGeminiAssistantOpen(true);

        window.addEventListener('open-api-key-modal', handleOpenKeyModal);
        window.addEventListener('open-gemini-assistant', handleOpenAssistantModal);

        return () => {
          window.removeEventListener('open-api-key-modal', handleOpenKeyModal);
          window.removeEventListener('open-gemini-assistant', handleOpenAssistantModal);
        };
      });

      return (
        <div className="min-h-screen flex flex-col justify-between relative pb-16 md:pb-0">
          <div>
            <window.Navbar />

            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 md:pt-8 pb-24 md:pb-8">
              {currentView === 'landing' && <window.LandingView />}
              {currentView === 'citizen' && <window.CitizenView />}
              {currentView === 'admin' && <window.AdminDashboard />}
              {currentView === 'kiosk' && <window.KioskScanner />}
              {currentView === 'login' && <window.LoginView />}
            </main>
          </div>

          {/* Mobile Glassmorphic Bottom Navigation Bar */}
          <window.MobileBottomNav />

          {/* Global AI Modals */}
          <window.ApiKeyModal
            isOpen={isApiKeyModalOpen}
            onClose={() => setIsApiKeyModalOpen(false)}
          />

          <window.GeminiAssistantModal
            isOpen={isGeminiAssistantOpen}
            onClose={() => setIsGeminiAssistantOpen(false)}
          />

          {/* FOOTER */}
          <footer className="bg-slate-950 border-t border-slate-900 py-8 text-xs text-slate-500 mt-12 mb-16 md:mb-0">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-heading font-bold text-slate-300">FlowSense AI</span>
                <span>— Smart Crowd Management & Virtual Queuing System for India</span>
              </div>

              <div className="flex items-center gap-6 font-mono text-[11px]">
                <span>Google Gemini AI Engine</span>
                <span>•</span>
                <span>Safety Threshold AI</span>
                <span>•</span>
                <span>Made for Public Spaces in India</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    function App() {
      return (
        <window.CrowdProvider>
          <MainContent />
        </window.CrowdProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // --- END src/App.js ---

  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('FlowSense PWA ServiceWorker registered:', reg.scope))
          .catch((err) => console.warn('FlowSense PWA ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>

</html>
